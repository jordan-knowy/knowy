name: garde-fous-knowr
on: [push, pull_request]
jobs:
  charte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Batterie garde-fous sur les sets de reference
        run: bash generateur/garde-fous/check-reference-sets.sh
